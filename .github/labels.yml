# Issue labels — synced automatically via .github/workflows/label-sync.yml
# Edit this file and push to main to update labels on GitHub.

# ── Type ──────────────────────────────────────────────────────────────────────
- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or improvement

- name: question
  color: "d876e3"
  description: Further information is requested

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

# ── Status ────────────────────────────────────────────────────────────────────
- name: triage
  color: "e4e669"
  description: Newly filed, needs review

- name: confirmed
  color: "0e8a16"
  description: Reproduced and accepted

- name: in progress
  color: "fbca04"
  description: Actively being worked on

- name: blocked
  color: "b60205"
  description: Waiting on an external dependency

- name: wontfix
  color: "ffffff"
  description: Out of scope or intentional behaviour

- name: duplicate
  color: "cfd3d7"
  description: Already tracked in another issue

- name: stale
  color: "c2e0c6"
  description: No recent activity

- name: "good first issue"
  color: "7057ff"
  description: Good for newcomers

# ── Component ─────────────────────────────────────────────────────────────────
- name: web
  color: "1d76db"
  description: "React frontend"

- name: backend
  color: "0052cc"
  description: "Hono API server"

- name: tui
  color: "5319e7"
  description: "Terminal UI"

- name: agent
  color: "006b75"
  description: "Headless benchmark runner"

- name: simulator
  color: "e99695"
  description: "LLM inference engine"

- name: core
  color: "f9d0c4"
  description: "Shared utilities / core package"

# ── Priority ──────────────────────────────────────────────────────────────────
- name: "priority: high"
  color: "b60205"
  description: Blocking or critical

- name: "priority: medium"
  color: "fbca04"
  description: Important but not blocking

- name: "priority: low"
  color: "c2e0c6"
  description: Nice-to-have

# ── Special ───────────────────────────────────────────────────────────────────
- name: security
  color: "ee0701"
  description: Security-related issue (do not file publicly)

- name: pinned
  color: "0075ca"
  description: Pinned — do not auto-close
