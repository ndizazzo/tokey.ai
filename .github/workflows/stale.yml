name: Mark stale issues

on:
  schedule:
    # Runs at 01:00 UTC every day
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Stale settings
          days-before-stale: 30
          days-before-close: 14

          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been inactive for 30 days and has been marked as stale.
            It will be closed in 14 days unless there is further activity.
            If this is still relevant, please leave a comment to keep it open.

          close-issue-message: >
            This issue was closed due to inactivity. If the problem persists,
            feel free to re-open it with updated information.

          # Never stale issues with these labels
          exempt-issue-labels: "pinned,security,in progress,confirmed,blocked"

          # Don't stale PRs (this repo shouldn't have any, but just in case)
          days-before-pr-stale: -1
          days-before-pr-close: -1
