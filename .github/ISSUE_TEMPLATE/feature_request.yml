name: 💡 Feature Request
description: Propose a new capability or improvement to Tokey
labels: ["feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! A well-scoped request is much easier to act on.
        
        **Before filing:** please [search existing issues](../../issues) to see if this has already been requested.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Tokey would this feature affect?
      options:
        - web (React frontend)
        - backend (Hono API)
        - tui (Terminal UI)
        - agent (Benchmark runner)
        - simulator (Inference engine)
        - core (Shared utilities)
        - multiple components
        - new component / unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem are you trying to solve? What use case does this enable?
      placeholder: "I'm always frustrated when... / It would be valuable to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like. Be as concrete as possible.
      placeholder: "Add a button that... / Expose an API endpoint that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why do you prefer this one?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - nice-to-have (would improve workflow)
        - important (current workaround is painful)
        - blocking (can't use Tokey without this)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, references to similar features in other tools, related issues, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been requested before
          required: true
        - label: I described the problem, not just the solution
          required: true
